name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # build.py derives published/updated dates from git log,
          # which needs the full history (the default shallow clone has only HEAD).
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install markdown

      - name: Build site
        run: python build.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # corest의 version.yml(YYMMDD.NNN, Asia/Seoul)을 단순화한 것. corest는 main 푸시마다
  # 태그하지만 여기서는 deploy 성공 뒤에 태그해서, 태그가 "실제로 배포된 버전"을 뜻한다.
  release:
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 오늘 날짜의 기존 태그와 직전 태그 이후 커밋 목록을 읽으려면 전체 이력이 필요하다
          fetch-depth: 0

      - name: Tag and create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DATE=$(TZ=Asia/Seoul date +'%y%m%d')
          MAX=0
          for tag in $(git tag -l "${DATE}.*"); do
            NUMBER=$((10#${tag##*.}))
            [ "$NUMBER" -gt "$MAX" ] && MAX=$NUMBER
          done
          VERSION="${DATE}.$(printf '%03d' $((MAX + 1)))"

          PREVIOUS_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$PREVIOUS_TAG" ]; then
            NOTES=$(git log "${PREVIOUS_TAG}..HEAD" --format='- %s')
          else
            NOTES=$(git log --format='- %s')
          fi

          git tag "$VERSION"
          git push origin "refs/tags/${VERSION}"
          gh release create "$VERSION" --title "$VERSION" --notes "$NOTES" --latest
