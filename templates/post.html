<article>
    <header>
        <h1>{title}</h1>
        <div class="post-meta">
            <ul>
                <li>
                    <ion-icon name="calendar-clear-outline"></ion-icon>
                    <span>Published</span>
                    <time datetime="{published_date}">{published_date}</time>
                </li>
                <li>
                    <ion-icon name="sync-outline"></ion-icon>
                    <span>Updated</span>
                    <time datetime="{updated_date}">{updated_date}</time>
                </li>
            </ul>
        </div>
    </header>

    {content}

    <footer>
        {post_nav}
    </footer>
</article>
